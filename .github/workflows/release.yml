name: CI / Windows release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: make deps
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  windows-release:
    name: Build Windows prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: lint-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check implementation readiness
        id: ready
        shell: pwsh
        run: |
          if (Test-Path build/TempestTrace.spec) {
            "value=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Design-only repository: no executable or release is published."
            "value=false" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-python@v7
        if: steps.ready.outputs.value == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        if: steps.ready.outputs.value == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Build one-file executable
        if: steps.ready.outputs.value == 'true'
        shell: pwsh
        run: python -m PyInstaller build/TempestTrace.spec --distpath dist --workpath build/tmp
      - name: Smoke-test executable
        if: steps.ready.outputs.value == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/TempestTrace.exe)) { throw "Missing Windows executable" }
          & ./dist/TempestTrace.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Windows executable smoke test failed" }
      - name: Resolve next tag
        if: steps.ready.outputs.value == 'true'
        id: version
        shell: pwsh
        run: python scripts/release_info.py
      - name: Create SHA-256 checksum
        if: steps.ready.outputs.value == 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TempestTrace.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TempestTrace.exe" | Set-Content dist/TempestTrace.exe.sha256
      - name: Create release tag
        if: steps.ready.outputs.value == 'true' && steps.version.outputs.create_tag == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh api "repos/$env:GITHUB_REPOSITORY/git/refs" --method POST --field "ref=refs/tags/$env:RELEASE_TAG" --field "sha=$env:GITHUB_SHA"
      - name: Publish prerelease
        if: steps.ready.outputs.value == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/TempestTrace.exe
            dist/TempestTrace.exe.sha256
