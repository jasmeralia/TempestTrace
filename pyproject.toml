[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempesttrace"
version = "0.0.0"
description = "Safe OBS diagnostic backup utility"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
authors = [{name = "Morgan Blackthorne", email = "morgan@windsofstorm.net"}]
# PyQt 6.12.0 ships QtGui stubs with invalid positional-only parameter order.
dependencies = ["PyQt6>=6.6,<6.12"]

[project.scripts]
tempesttrace = "tempesttrace.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/tempesttrace", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
