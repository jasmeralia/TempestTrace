name: CI / Windows release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize retries of one commit without dropping releases for other commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: make deps
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          # Fork PRs use Codecov's tokenless public-repository upload path.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: true

  windows-release:
    name: Build Windows prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: lint-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check implementation readiness
        id: ready
        shell: pwsh
        run: |
          # The marker is added only after Windows and Linux release jobs exist.
          if ((Test-Path build/TempestTrace.spec) -and (Test-Path build/installer.nsi) -and (Test-Path build/release-ready)) {
            "value=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release pipeline incomplete: no executable or release is published."
            "value=false" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-python@v7
        if: steps.ready.outputs.value == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        if: steps.ready.outputs.value == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Build one-file executable
        if: steps.ready.outputs.value == 'true'
        shell: pwsh
        run: python -m PyInstaller build/TempestTrace.spec --distpath dist --workpath build/tmp
      - name: Smoke-test executable
        if: steps.ready.outputs.value == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/TempestTrace.exe)) { throw "Missing Windows executable" }
          & ./dist/TempestTrace.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Windows executable smoke test failed" }
      - name: Resolve next tag
        if: steps.ready.outputs.value == 'true'
        id: version
        shell: pwsh
        run: python scripts/release_info.py
      - name: Ensure NSIS
        if: steps.ready.outputs.value == 'true'
        shell: pwsh
        run: |
          $nsisX86 = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          $nsisX64 = "${env:ProgramFiles}\NSIS\makensis.exe"
          if (-not ((Test-Path $nsisX86) -or (Test-Path $nsisX64))) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          }
      - name: Build NSIS installer
        if: steps.ready.outputs.value == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = "${env:ProgramFiles}\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { throw "makensis.exe not found" }
          & $nsis "/DAPP_VERSION=$env:RELEASE_TAG" build/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed" }
          if (-not (Test-Path "dist/TempestTrace-Setup-$env:RELEASE_TAG.exe")) {
            throw "Missing NSIS installer"
          }
      - name: Smoke-test NSIS install and uninstall
        if: steps.ready.outputs.value == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'TempestTrace-nsis-smoke'
          $installer = (Resolve-Path "dist/TempestTrace-Setup-$env:RELEASE_TAG.exe").Path
          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed" }
          $app = Join-Path $installDir 'TempestTrace.exe'
          if (-not (Test-Path $app)) { throw "Installed executable is missing" }
          if (-not (Test-Path (Join-Path $installDir 'LICENSE'))) { throw "Installed license is missing" }
          & $app --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Installed executable smoke test failed" }
          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS silent uninstall failed" }
          if (Test-Path $app) { throw "Uninstall left the executable installed" }
          if (Test-Path (Join-Path $installDir 'LICENSE')) { throw "Uninstall left the license installed" }
      - name: Create SHA-256 checksum
        if: steps.ready.outputs.value == 'true'
        shell: pwsh
        run: |
          $assets = @(Get-Item -LiteralPath 'dist/TempestTrace.exe', "dist/TempestTrace-Setup-${{ steps.version.outputs.tag }}.exe" -ErrorAction Stop)
          foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)" | Set-Content "$($asset.FullName).sha256"
          }
      - name: Create release tag
        if: steps.ready.outputs.value == 'true' && steps.version.outputs.create_tag == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh api "repos/$env:GITHUB_REPOSITORY/git/refs" --method POST --field "ref=refs/tags/$env:RELEASE_TAG" --field "sha=$env:GITHUB_SHA"
      - name: Preserve manually promoted releases
        if: steps.ready.outputs.value == 'true'
        id: release-state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $promoted = $false
          try {
            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
            $promoted = (-not $release.draft) -and (-not $release.prerelease)
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          "promoted=$($promoted.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($promoted) { Write-Host "Release was manually promoted; leaving it unchanged." }
      - name: Publish prerelease
        if: steps.ready.outputs.value == 'true' && steps.release-state.outputs.promoted != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/TempestTrace.exe
            dist/TempestTrace.exe.sha256
            dist/TempestTrace-Setup-${{ steps.version.outputs.tag }}.exe
            dist/TempestTrace-Setup-${{ steps.version.outputs.tag }}.exe.sha256
